[package]
name = "typeglass-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
regex = "1.10"
sealed = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time"] }
tower-lsp = "0.20"
uuid = { version = "1", features = ["v4", "serde"] }
which = "6.0"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2.0"
predicates = "3.0"
dirs = "5.0"
